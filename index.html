<!DOCTYPE html>
<html lang="kk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Elzhas сайты</title>

    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f2f5ff;
            text-align: center;
        }

        header {
            background: #4f46e5;
            color: white;
            padding: 30px;
        }

        .card {
            background: white;
            max-width: 400px;
            margin: 40px auto;
            padding: 30px;
            border-radius: 20px;
        }

        button {
            background: #4f46e5;
            color: white;
            border: none;
            padding: 12px 25px;
            border-radius: 10px;
            font-size: 18px;
        }
    </style>
</head>

<body>

    <header>
        <h1>🚀 Менің сайтым</h1>
        <p>Бағдарламалауды үйреніп жатырмын</p>
    </header>

    <div class="card">
        <h2>Сәлем!</h2>

        <p id="text">
            Бұл менің алғашқы сайтым.
        </p>

        <button onclick="hello()">Бас</button>
    </div>

    <script>
        function hello() {
            document.getElementById("text").innerText =
                "Қотақ🫰🏼😂! 🔥";
        }
    </script>

</body>
  </html>
